        description: "Zones de végétation BD TOPO"

      - name: bdtopo_batiments
        description: "Bâtiments BD TOPO"

      - name: bdtopo_lignes_elec
        description: "Lignes électriques BD TOPO"

      - name: bdtopo_pylones
        description: "Pylônes BD TOPO"

      - name: sia_obstacles
        description: "Obstacles aéronautiques SIA/DGAC (BDOSA)"

      - name: anfr_faisceaux_hertziens
